# CI runs only advisories and sources. License acceptance needs a maintainer
# policy; this configuration does not invent one from the current dependencies.
[advisories]
ignore = [  ]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
# Existing dioxus-primitives dependency, reviewed against Cargo.toml/Cargo.lock.
allow-git = [ "https://github.com/DioxusLabs/components" ]
