name: update shared revisions

on:
  workflow_call:
    inputs:
      app_client_id:
        description: Client ID for the GitHub App installed in the caller repository
        required: true
        type: string
    secrets:
      app_private_key:
        description: Private key for the GitHub App installed in the caller repository
        required: true

permissions: {}

concurrency:
  group: update-shared-revisions-${{ github.repository }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app_token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Update shared revisions
        id: update
        uses: stayhydated/shared/.github/actions/update-shared-revisions@master

      - name: Validate Cargo update
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          cargo metadata --format-version 1 > /dev/null
          git diff --check

      - name: Resolve GitHub App bot user
        id: app_bot
        if: steps.update.outputs.changed == 'true'
        env:
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        shell: bash
        run: echo "user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Commit and push update
        if: steps.update.outputs.changed == 'true'
        env:
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.app_bot.outputs.user_id }}
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          SOURCE_SHORT_SHA: ${{ steps.update.outputs.source_short_sha }}
        shell: bash
        run: |
          set -euo pipefail

          update_branch="automation/update-shared-revisions"

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
          git checkout -B "$update_branch"
          git add -A
          git diff --cached --check
          git commit -m "chore(deps): update shared revisions to ${SOURCE_SHORT_SHA}"
          git push --force origin "HEAD:refs/heads/${update_branch}"

      - name: Open or update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          SOURCE_SHA: ${{ steps.update.outputs.source_sha }}
          SOURCE_SHORT_SHA: ${{ steps.update.outputs.source_short_sha }}
        shell: bash
        run: |
          set -euo pipefail

          update_branch="automation/update-shared-revisions"
          title="chore(deps): update shared revisions"
          body="This automated pull request updates Cargo dependencies sourced from [stayhydated/shared](https://github.com/stayhydated/shared) to commit [\`${SOURCE_SHORT_SHA}\`](https://github.com/stayhydated/shared/commit/${SOURCE_SHA})."
          pull_request_url="$(gh pr list \
            --base "$BASE_BRANCH" \
            --head "$update_branch" \
            --json url \
            --jq '.[0].url')"

          if [[ -z "$pull_request_url" ]]; then
            pull_request_url="$(gh pr create \
              --base "$BASE_BRANCH" \
              --head "$update_branch" \
              --title "$title" \
              --body "$body")"
          else
            gh pr edit "$pull_request_url" --title "$title" --body "$body"
          fi

          echo "Pull request: ${pull_request_url}" >> "$GITHUB_STEP_SUMMARY"
