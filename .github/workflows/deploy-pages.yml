name: deploy GitHub Pages

on:
  workflow_call:
    inputs:
      build-command:
        description: Shell commands that assemble the static site artifact.
        required: true
        type: string
      artifact-path:
        description: Static site directory uploaded to GitHub Pages.
        default: web/dist
        required: false
        type: string
      dioxus-cli-version:
        description: dioxus-cli version installed for the build.
        default: 0.7.9
        required: false
        type: string
      trunk-version:
        description: Trunk version installed when the build includes browser demos.
        default: 0.21.14
        required: false
        type: string
      install-trunk:
        description: Install Trunk for a browser demo build.
        default: false
        required: false
        type: boolean
      install-nightly:
        description: Install nightly with the wasm32 target for a GPUI demo build.
        default: false
        required: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIOXUS_CLI_VERSION: ${{ inputs.dioxus-cli-version }}
      TRUNK_SKIP_VERSION_CHECK: "true"
      TRUNK_VERSION: ${{ inputs.trunk-version }}

    steps:
      - uses: actions/checkout@v7

      - uses: mozilla-actions/sccache-action@v0.0.10

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install nightly toolchain for GPUI demos
        if: inputs.install-nightly
        shell: bash
        run: |
          rustup toolchain install nightly --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain nightly

      - uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        shell: bash
        run: cargo binstall dioxus-cli --version "$DIOXUS_CLI_VERSION" --no-confirm
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"

      - name: Install Trunk
        if: inputs.install-trunk
        shell: bash
        run: cargo binstall trunk --version "$TRUNK_VERSION" --no-confirm
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"

      - name: Build web site
        shell: bash
        run: ${{ inputs.build-command }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.artifact-path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
