name: deploy GitHub Pages

on:
  workflow_call:
    inputs:
      build-command:
        description: Shell commands that assemble the static site artifact.
        required: true
        type: string
      artifact-path:
        description: Static site directory uploaded to GitHub Pages.
        default: web/dist
        required: false
        type: string
      dioxus-cli-version:
        description: dioxus-cli version installed for the build.
        default: 0.7.9
        required: false
        type: string
      trunk-version:
        description: Trunk version installed when the build includes browser demos.
        default: 0.21.14
        required: false
        type: string
      install-trunk:
        description: Install Trunk for a browser demo build.
        default: false
        required: false
        type: boolean
      install-nightly:
        description: Install nightly with the wasm32 target for a GPUI demo build.
        default: false
        required: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
      DIOXUS_CLI_VERSION: ${{ inputs.dioxus-cli-version }}
      TRUNK_SKIP_VERSION_CHECK: "true"
      TRUNK_VERSION: ${{ inputs.trunk-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install nightly toolchain for GPUI demos
        if: inputs.install-nightly
        shell: bash
        run: |
          rustup toolchain install nightly --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain nightly

      - uses: cargo-bins/cargo-binstall@3be4ad2b146f3302f92e5956c54fedbb6ae8cccc # main
        with:
          version: "1.25.1"

      - name: Install Dioxus CLI
        shell: bash
        run: cargo binstall dioxus-cli --version "$DIOXUS_CLI_VERSION" --no-confirm
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"

      - name: Install Trunk
        if: inputs.install-trunk
        shell: bash
        run: cargo binstall trunk --version "$TRUNK_VERSION" --no-confirm
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"

      - name: Build web site
        shell: bash
        run: ${{ inputs.build-command }}

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ inputs.artifact-path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
