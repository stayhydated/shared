name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: true
  RUSTC_WRAPPER: sccache

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: cargo test --workspace --all-features --locked
          - os: macos-latest
            command: cargo test --workspace --all-features --locked
          - os: windows-latest
            command: cargo test --workspace --all-features --locked

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Setup mold
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      - name: Run tests
        run: ${{ matrix.command }}

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  quality:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Taplo and ShellCheck
        uses: taiki-e/install-action@v2.87.27
        with:
          tool: "taplo@0.10.0,shellcheck@0.11.0"
          checksum: true
          fallback: none
      - name: Check TOML formatting
        run: taplo fmt --check
      - name: Check Markdown
        uses: rvben/rumdl@v0.2.79
        with:
          version: "0.2.78"
          command: check
          path: "."
          fail-on-error: "true"
      - name: Prevent checkout-controlled typos executable reuse
        run: test ! -e typos && test ! -L typos
      - name: Check spelling
        uses: crate-ci/typos@v1.42.3
        with:
          write_changes: false
      - uses: cargo-bins/cargo-binstall@v1.25.3
        with:
          version: "1.25.1"
      - name: Install derive sorter
        run: cargo binstall cargo-sort-derives --version '=0.13.0' --locked --no-confirm
      - name: Check derive order
        run: cargo sort-derives --check
      - name: Check workflows
        uses: docker://rhysd/actionlint:1.7.12 # includes ShellCheck and pyflakes
      - name: Check shell scripts
        run: git ls-files -z '*.sh' '*.bash' | xargs -0 --no-run-if-empty shellcheck

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install locked frontend tools
        run: bun install --frozen-lockfile
      - name: Check frontend formatting
        run: bun run fmt --check
      - name: Lint frontend assets
        run: bun run lint

  dependencies:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check dependency advisories and sources
        uses: EmbarkStudios/cargo-deny-action@v2.1.1 # cargo-deny 0.20.2
        with:
          rust-version: stable
          arguments: "--workspace --all-features --locked"
          command: check
          command-arguments: "advisories sources"

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Setup mold
        uses: rui314/setup-mold@v1

      - name: Lint code
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

  machete:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - uses: cargo-bins/cargo-binstall@v1.25.3
        with:
          version: "1.25.1"

      - name: Install pinned cargo-machete
        run: cargo binstall cargo-machete --version '=0.9.2' --locked --no-confirm

      - name: Machete
        run: cargo machete

  rust-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Setup mold
        uses: rui314/setup-mold@v1

      - uses: cargo-bins/cargo-binstall@v1.25.3
        with:
          version: "1.25.1"

      - name: Install cargo-llvm-cov
        shell: bash
        run: cargo binstall cargo-llvm-cov --version 0.9.1 --locked --no-confirm

      - name: Run coverage
        shell: bash
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --all-features --all-targets --locked --cobertura --output-path=target/cobertura.xml --exclude xtask-dummy --exclude web-dummy --exclude sum-numbers-ai-dummy --exclude sum-numbers-ai-bevy-demo --exclude sum-numbers-ai-gpui-demo

      - name: Codecov publish
        uses: codecov/codecov-action@v7
        with:
          files: target/cobertura.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Codecov housekeeping
        shell: bash
        run: |
          rm -f codecov codecov.SHA256SUM codecov.SHA256SUM.sig

  browser-renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Compile browser-only renderer
        run: cargo check -p stayhydated-dioxus-core --all-features --target wasm32-unknown-unknown --locked

  dummy-site:
    runs-on: ubuntu-latest
    env:
      TRUNK_SKIP_VERSION_CHECK: "true"
      TRUNK_BUILD_LOCKED: "true"
      MDBOOK_BUILD__CREATE_MISSING: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install nightly for the existing GPUI browser demo
        run: |
          rustup toolchain install nightly --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain nightly

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - uses: cargo-bins/cargo-binstall@v1.25.3
        with:
          version: "1.25.1"

      - name: Install existing site build tools
        run: cargo binstall --locked --no-confirm dioxus-cli@=0.7.9 trunk@=0.21.14 just@=1.58.0

      - name: Validate the locked workspace graph
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Build dummy documentation, demos, and site
        run: just dummy web-build

      - name: Check assembled site outputs
        run: |
          test -s dummy/web-dummy/dist/index.html
          test -s dummy/web-dummy/dist/404.html
          test -s dummy/web-dummy/dist/sitemap.xml
          test -s dummy/web-dummy/dist/book/index.html
          test -s dummy/web-dummy/dist/bevy-demo/index.html
          test -s dummy/web-dummy/dist/gpui-demo/index.html
          test -s dummy/web-dummy/dist/llms.txt
          test -s dummy/web-dummy/dist/llms-full.txt

      - name: Reject tracked Cargo lockfile drift
        if: always()
        run: git diff --exit-code -- Cargo.lock ':(glob)**/Cargo.lock'
